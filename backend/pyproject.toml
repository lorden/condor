[project]
name = "condor-backend"
version = "0.1.0"
description = "FastAPI backend for Condor."
readme = "../README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "pydantic",
    "sqlalchemy",
    "uvicorn[standard]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
